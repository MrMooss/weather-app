@if (isAddingTask) {
  <app-new-task [userId]="userid" (close)="onCloseAdd()" />
}

<section id="tasks">
  <header>
    <h2>{{name}}'s tasks</h2>
    <menu>
      <button (click)="onAddTask()">Add Task</button>
    </menu>
  </header>

  <ul>
    @for (task of selectedUserTasks; track task.id) {
      <li>
        <app-task [userTask]="task"/>
      </li>
    }
  </ul>
</section>
